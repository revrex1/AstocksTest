<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>磐石选股 · 跟踪复盘</title>
<meta name="description" content="第三方选股建议的每日跟踪与策略可靠性评估">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f7f9;color:#1a1d21;font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 22px 60px}
h1{font-size:21px;margin:0 0 4px;letter-spacing:.3px}
h2{font-size:15px;margin:26px 0 12px;padding-left:9px;border-left:3px solid #2f6fed}
.sub{color:#6b7280;font-size:12.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:12px;margin:18px 0 6px}
.card{background:#fff;border:1px solid #e7e9ee;border-radius:10px;padding:13px 15px}
.card .k{font-size:12px;color:#6b7280}
.card .v{font-size:20px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums}
.up{color:#d9363e}.down{color:#12965a}.flat{color:#6b7280}
.banner{margin-top:16px;padding:14px 17px;border-radius:10px;background:#eef3ff;border:1px solid #d3e0ff}
.banner b{font-size:15px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e7e9ee;border-radius:10px;overflow:hidden;font-size:13px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid #f0f1f4;white-space:nowrap}
th{background:#fafbfc;color:#5b6270;font-weight:500;font-size:12px;text-align:right}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fbfcfe}
.tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;border:1px solid #d9dde6;color:#4b5563}
.tag.strong{background:#fdecec;border-color:#f7cccd;color:#c22a33}
.tag.watch{background:#eef2ff;border-color:#d6ddfb;color:#3b52b4}
.panel{background:#fff;border:1px solid #e7e9ee;border-radius:10px;padding:16px 14px 8px;overflow-x:auto}
.legend{font-size:12px;color:#6b7280;margin:0 0 6px 2px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 5px 0 12px}
.note{font-size:12px;color:#6b7280;line-height:1.75;margin-top:10px}
.muted{color:#9aa1ac}
.empty{background:#fff;border:1px dashed #dcdfe6;border-radius:10px;padding:26px;text-align:center;color:#8b919c}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 6px}
.chip{padding:6px 12px;border:1px solid #dfe3ea;background:#fff;border-radius:20px;font-size:12.5px;
      color:#4b5563;cursor:pointer;font-variant-numeric:tabular-nums}
.chip:hover{border-color:#b9c6e6}
.chip.on{background:#2f6fed;border-color:#2f6fed;color:#fff}
.chip .p{font-size:11px;opacity:.72;margin-left:6px}
section.day[hidden]{display:none}
.hint{font-size:12px;color:#8b919c;margin:2px 0 0}
.loading{text-align:center;padding:60px 20px;color:#8b919c;font-size:14px}
</style></head>
<body><div class="wrap" id="app">
<div class="loading" id="loading">加载中…</div>
</div>
<script>
(function(){
"use strict";

var DATA_BASE = "https://revrex1.github.io/AstocksTest/data";

var $ = document.getElementById("app");
var idx = null, days = {}, curDay = null;

function fmt(v, d, s){ if(v==null) return "-"; var n=Number(v); if(isNaN(n)) return "-"; var r=(n*Math.pow(10,d)).toFixed(0); r=r.slice(0,-d)+("."+r.slice(-d)); if(d===0) r=String(Math.round(n)); else r=(n).toFixed(d); if(s) r=(n>=0?"+":"")+r; return r+"%"; }
function pct(v){ if(v==null) return "-"; return (v*100).toFixed(2)+"%"; }
function pct1(v){ if(v==null) return "-"; return (v*100).toFixed(1)+"%"; }
function cls(v){ if(v==null) return "flat"; return v>0?"up":v<0?"down":"flat"; }
function sign(v){ if(v==null) return "-"; return (v>0?"+":"")+(v*100).toFixed(2)+"%"; }
function num(v,d){ if(v==null) return "-"; return Number(v).toFixed(d!=null?d:2); }

function tagClass(r){ return r==="强推"?"tag strong":"tag watch"; }

async function loadJSON(path){
  var r = await fetch(DATA_BASE + "/" + path, {cache:"no-store"});
  if(!r.ok) throw new Error(r.status+" "+path);
  return r.json();
}

async function init(){
  try {
    idx = await loadJSON("index.json");
  } catch(e){
    $.innerHTML = '<div class="empty">数据加载失败：'+e.message+'<br><span class="sub">请确认 Storage 数据已上传</span></div>';
    return;
  }
  render();
  loadDay(idx.dates[idx.dates.length-1]);
}

function loadDay(d){
  if(days[d]){ showDay(d); return; }
  loadJSON(d+".json").then(function(j){
    days[d] = j;
    showDay(d);
  }).catch(function(e){
    console.error("Failed to load day", d, e);
  });
}

function render(){
  var s = idx.summary;
  var html = '';
  html += '<h1>磐石选股 · 跟踪复盘</h1>';
  html += '<div class="sub">数据源 <a href="https://bqgxkzv5v9.coze.site/picks" target="_blank" rel="noopener">https://bqgxkzv5v9.coze.site/picks</a>';
  html += ' · 最新记录 '+idx.latest+' · 生成 '+idx.updated_at;
  html += ' · 口径：开盘记录时点价 → 当日收盘，基准 沪深300</div>';

  html += '<div class="cards">';
  html += card("策略累计净值", num(s.nav,4), cls(s.nav-1));
  html += card("vs 沪深300", sign(s.excess_nav), cls(s.excess_nav));
  html += card("胜率", pct1(s.win_rate), "");
  html += card("平均单票收益", sign(s.avg), cls(s.avg));
  html += card("平均超额", sign(s.avg_excess), cls(s.avg_excess));
  html += card("可评估样本", s.samples+" / "+s.days+"日", "");
  html += card("最大回撤", pct1(s.max_dd), cls(s.max_dd));
  html += '</div>';

  var vc = s.verdict==="偏弱"?"down":s.verdict==="可靠"?"up":"";
  html += '<div class="banner"><b class="'+vc+'">策略评级：'+s.verdict+'</b> —— '+esc(s.verdict_reason)+'</div>';

  html += '<h2>按交易日回溯</h2>';
  html += '<div class="chips" id="chips">';
  for(var i=idx.daily.length-1;i>=0;i--){
    var d=idx.daily[i];
    html += '<button class="chip" data-d="'+d.date+'">'+d.date+'<span class="p">'+sign(d.avg_ret)+'</span></button>';
  }
  html += '</div>';
  html += '<div class="hint">点日期切换；链接末尾带 <code>#YYYY-MM-DD</code> 可直接分享某一天。</div>';
  html += '<div id="day-container"></div>';

  html += renderPaperGlobal();
  html += renderNavChart();
  html += renderDailyReturns();
  html += renderLayers();
  html += renderHorizons();
  html += renderAllDays();

  html += '<div class="note">口径与局限：① 推荐来自第三方站点实时研判接口，非历史存档；② 收益按记录时点价等权计算，未计佣金滑点；';
  html += '③ 收盘价与 T+N 收盘价取自站点日线接口，偶有次日修正；④ 样本 &lt; 5 条时评级固定为「样本不足」；';
  html += '⑤ 本页仅为个人跟踪记录，不构成任何投资建议。</div>';

  $.innerHTML = html;

  document.getElementById("chips").addEventListener("click", function(e){
    var btn = e.target.closest(".chip");
    if(!btn) return;
    loadDay(btn.getAttribute("data-d"));
  });

  var h = (location.hash||"").replace("#","");
  if(idx.dates.indexOf(h)>=0) loadDay(h);
}

function card(k,v,c){ return '<div class="card"><div class="k">'+k+'</div><div class="v '+(c||'')+'">'+v+'</div></div>'; }
function esc(s){ if(!s) return ""; return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function showDay(d){
  curDay = d;
  var chips = document.querySelectorAll("#chips .chip");
  chips.forEach(function(c){ c.classList.toggle("on", c.getAttribute("data-d")===d); });
  if(history.replaceState) history.replaceState(null, "", "#"+d);

  var j = days[d]; if(!j) return;
  var st = j.stats;
  var ct = document.getElementById("day-container");
  var h = '';

  h += '<section class="day" data-d="'+d+'">';
  h += '<div class="cards">';
  h += card("推荐数", st.picks, "");
  h += card("胜率", pct1(st.win_rate), "");
  h += card("组合收益", sign(st.avg_ret), cls(st.avg_ret));
  h += card("超额", sign(st.avg_excess), cls(st.avg_excess));
  h += card("沪深300", sign(j.bench_pct), cls(j.bench_pct));
  h += card("净值", num(st.nav,4), "");
  h += '</div>';

  h += '<h2>当日推荐 · '+d+'</h2>';
  h += '<div class="panel"><table><thead><tr><th>#</th><th class="l">代码</th><th class="l">名称</th><th class="l">评级</th><th>综合分</th><th>记录价</th><th>当日</th><th>超额</th><th>最大浮盈</th><th>最大浮亏</th><th>T+1</th><th>T+3</th><th>T+5</th></tr></thead><tbody>';
  j.picks.forEach(function(p){
    h += '<tr><td>'+p.rank+'</td><td class="l">'+p.code+'</td><td class="l">'+esc(p.name)+'</td><td class="l"><span class="'+tagClass(p.rating)+'">'+p.rating+'</span></td>';
    h += '<td>'+num(p.total_score,1)+'</td><td>'+num(p.ref_price,2)+'</td>';
    h += '<td class="'+cls(p.ret_d0)+'">'+sign(p.ret_d0)+'</td>';
    h += '<td class="'+cls(p.excess_d0)+'">'+sign(p.excess_d0)+'</td>';
    h += '<td class="'+cls(p.mfe_d0)+'">'+sign(p.mfe_d0)+'</td>';
    h += '<td class="'+cls(p.mae_d0)+'">'+sign(p.mae_d0)+'</td>';
    h += '<td class="'+cls(p.ret_t1)+'">'+(p.ret_t1!=null?sign(p.ret_t1):'<span class="muted">-</span>')+'</td>';
    h += '<td class="'+cls(p.ret_t3)+'">'+(p.ret_t3!=null?sign(p.ret_t3):'<span class="muted">-</span>')+'</td>';
    h += '<td class="'+cls(p.ret_t5)+'">'+(p.ret_t5!=null?sign(p.ret_t5):'<span class="muted">-</span>')+'</td>';
    h += '</tr>';
  });
  h += '</tbody></table></div>';

  if(j.sectors && j.sectors.length){
    h += '<h2>市场环境 · '+d+'</h2><div class="panel"><div class="panel"><table><thead><tr><th class="l">行业板块</th><th>涨跌幅</th><th>主力净流入(亿)</th><th class="l">领涨股</th></tr></thead><tbody>';
    j.sectors.forEach(function(s){
      h += '<tr><td class="l">'+esc(s.name)+'</td><td class="'+cls(s.changePct)+'">'+sign(s.changePct/100)+'</td><td>'+num(s.mainNetInflowYi,2)+'</td><td class="l">'+esc(s.leader)+'</td></tr>';
    });
    h += '</tbody></table></div>';

    if(j.fundflow){
      var ff = Array.isArray(j.fundflow) ? j.fundflow : Object.keys(j.fundflow).map(function(k){return j.fundflow[k];});
      if(ff.length){
        h += '<div class="panel"><table><thead><tr><th class="l">推荐股</th><th>主力净流入(亿)</th><th>5日(亿)</th></tr></thead><tbody>';
        ff.forEach(function(f){
          h += '<tr><td class="l">'+f.code+' '+esc(f.name)+'</td><td>'+num(f.mainNetInflowYi,2)+'</td><td>'+num(f.mainNetInflow5dYi,2)+'</td></tr>';
        });
        h += '</tbody></table></div>';
      }
    }
    h += '</div>';
  }

  h += '</section>';
  ct.innerHTML = h;
}

function renderPaperGlobal(){
  var p = idx.paper; if(!p) return "";
  var h = '<h2>虚拟交易 · 强推 <span class="sub">（按建议买卖点纸面执行）</span></h2>';
  h += '<div class="panel"><table><thead><tr><th class="l">代码</th><th class="l">名称</th><th class="l">建仓日</th><th>成交价</th><th>数量</th><th>现价</th><th>浮动</th><th>止损</th></tr></thead><tbody>';

  var latestDay = idx.dates[idx.dates.length-1];
  var dj = days[latestDay];
  var holdings = dj && dj.paper_holdings ? dj.paper_holdings : [];

  if(!holdings.length){
    h += '<tr><td colspan="8" class="muted" style="text-align:center">暂无持仓</td></tr>';
  } else {
    holdings.forEach(function(ph){
      h += '<tr><td class="l">'+ph.code+'</td><td class="l">'+esc(ph.name)+'</td><td class="l">'+ph.fill_date+'</td>';
      h += '<td>'+num(ph.fill_price,2)+'</td><td>'+ph.qty+'</td>';
      h += '<td>'+num(ph.last_price,2)+'</td>';
      h += '<td class="'+cls(ph.ret_pct)+'">'+sign(ph.ret_pct)+'</td>';
      h += '<td>'+num(ph.stop_price,2)+'</td></tr>';
    });
  }
  h += '</tbody></table></div>';
  var v = p.verdict;
  var vText = Array.isArray(v) ? v.join(" —— ") : (v||"-");
  h += '<div class="note">持仓 '+(p.open||0)+' 笔 · 已平仓 '+(p.closed||0)+' 笔 · 结论：<b>'+esc(vText)+'</b></div>';
  return h;
}

function renderNavChart(){
  if(!idx.daily||!idx.daily.length) return "";
  var dd = idx.daily;
  var navs = dd.map(function(d){return d.nav;});
  var benchs = dd.map(function(d){return d.bench_nav;});
  var all = navs.concat(benchs);
  var mn = Math.min.apply(null,all), mx = Math.max.apply(null,all);
  var pad = (mx-mn)*0.15||0.01; mn-=pad; mx+=pad;

  var W=1100, H=230, PL=46, PR=1100, PT=14, PB=204;
  var xStep = dd.length>1 ? (PR-PL)/(dd.length-1) : 0;
  function sx(i){ return PL+i*xStep; }
  function sy(v){ return PB-(v-mn)/(mx-mn)*(PB-PT); }

  var h = '<h2>净值曲线</h2>';
  h += '<div class="legend"><i style="background:#d9363e"></i>策略（等权复利）<i style="background:#b9c0cc"></i>沪深300</div>';
  h += '<div class="panel"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="height:auto;display:block">';

  var ticks = 5;
  for(var t=0;t<ticks;t++){
    var v = mn+(mx-mn)*t/(ticks-1);
    var y = sy(v);
    h += '<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+PR+'" y2="'+y.toFixed(1)+'" stroke="#eef0f3"/>';
    h += '<text x="'+(PL-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="#9aa1ac">'+v.toFixed(3)+'</text>';
  }

  var benchPath = dd.map(function(d,i){return (i?"L":"M")+sx(i).toFixed(1)+","+sy(d.bench_nav).toFixed(1);}).join(" ");
  h += '<path d="'+benchPath+'" fill="none" stroke="#b9c0cc" stroke-width="1.6" stroke-dasharray="4 3"/>';

  var navPath = dd.map(function(d,i){return (i?"L":"M")+sx(i).toFixed(1)+","+sy(d.nav).toFixed(1);}).join(" ");
  h += '<path d="'+navPath+'" fill="none" stroke="#d9363e" stroke-width="2.2"/>';

  dd.forEach(function(d,i){
    if(i===0||i===dd.length-1||(dd.length>3&&i===Math.floor(dd.length/2))){
      h += '<text x="'+sx(i).toFixed(1)+'" y="222" text-anchor="middle" font-size="10" fill="#9aa1ac">'+d.date.slice(5)+'</text>';
    }
  });

  h += '</svg></div>';
  return h;
}

function renderDailyReturns(){
  if(!idx.daily||!idx.daily.length) return "";
  var dd = idx.daily;
  var vals = dd.map(function(d){return d.avg_ret*100;});
  var mx = Math.max.apply(null, vals.map(Math.abs))||1;
  var W=1100, H=180, PL=46, PR=1100, PT=22, PB=152, MID=83;
  var barW = Math.min(56, (PR-PL)/dd.length*0.7);
  var xStep = dd.length>1 ? (PR-PL)/(dd.length-1) : (PR-PL)/2;

  var h = '<h2>每日组合收益</h2><div class="panel"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="height:auto;display:block">';
  h += '<line x1="'+PL+'" y1="'+MID+'" x2="'+PR+'" y2="'+MID+'" stroke="#e3e6ea"/>';

  var scale = (PB-PT)/2/mx;
  h += '<text x="38" y="'+(MID-mx*scale-4).toFixed(0)+'" text-anchor="end" font-size="10" fill="#9aa1ac">+'+mx.toFixed(1)+'%</text>';
  h += '<text x="38" y="'+(MID+mx*scale+12).toFixed(0)+'" text-anchor="end" font-size="10" fill="#9aa1ac">-'+mx.toFixed(1)+'%</text>';

  dd.forEach(function(d,i){
    var v = d.avg_ret*100;
    var x = PL + i*xStep - barW/2;
    var barH = Math.abs(v)*scale;
    var y = v>=0 ? MID-barH : MID;
    var color = v>=0 ? "#d9363e" : "#12965a";
    h += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW+'" height="'+barH.toFixed(1)+'" fill="'+color+'" opacity=".78" rx="1.5"><title>'+d.date+' '+sign(d.avg_ret)+'</title></rect>';
  });

  h += '<text x="'+PL+'" y="172" font-size="10" fill="#9aa1ac">'+dd[0].date+'</text>';
  h += '<text x="'+PR+'" y="172" text-anchor="end" font-size="10" fill="#9aa1ac">'+dd[dd.length-1].date+'</text>';
  h += '</svg></div>';
  return h;
}

function renderLayers(){
  if(!idx.layers) return "";
  var h = '<h2>分层表现</h2><div class="panel"><table><thead><tr><th class="l">分层</th><th>样本</th><th>胜率</th><th>平均收益</th><th>盈亏比</th></tr></thead><tbody>';
  ["强推","可关注","Top3","4名以后"].forEach(function(k){
    var L = idx.layers[k]; if(!L) return;
    h += '<tr><td class="l">'+k+'</td><td>'+L.n+'</td><td>'+pct1(L.win_rate)+'</td>';
    h += '<td class="'+cls(L.avg)+'">'+sign(L.avg)+'</td><td>'+num(L.profit_factor)+'</td></tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

function renderHorizons(){
  if(!idx.horizons) return "";
  var h = '<h2>持有期跟踪</h2><div class="panel"><table><thead><tr><th class="l">区间</th><th>样本</th><th>胜率</th><th>平均收益</th></tr></thead><tbody>';
  ["T+1","T+3","T+5"].forEach(function(k){
    var H = idx.horizons[k]; if(!H) return;
    h += '<tr><td class="l">'+k+'</td><td>'+H.n+'</td>';
    h += '<td>'+(H.win_rate!=null?pct1(H.win_rate):'-')+'</td>';
    h += '<td class="'+cls(H.avg)+'">'+(H.avg!=null?sign(H.avg):'<span class="muted">-</span>')+'</td></tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

function renderAllDays(){
  if(!idx.daily||!idx.daily.length) return "";
  var h = '<h2>全部交易日</h2><div class="panel"><table><thead><tr><th class="l">日期</th><th>推荐数</th><th>胜率</th><th>组合收益</th><th>超额</th><th>基准</th><th>净值</th></tr></thead><tbody>';
  idx.daily.forEach(function(d){
    h += '<tr><td class="l"><a href="#'+d.date+'">'+d.date+'</a></td><td>'+d.picks+'</td><td>'+pct1(d.win_rate)+'</td>';
    h += '<td class="'+cls(d.avg_ret)+'">'+sign(d.avg_ret)+'</td>';
    h += '<td class="'+cls(d.avg_excess)+'">'+sign(d.avg_excess)+'</td>';
    h += '<td class="'+cls(d.bench_pct)+'">'+sign(d.bench_pct)+'</td>';
    h += '<td>'+num(d.nav,4)+'</td></tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

init();
})();
</script>
</body></html>
